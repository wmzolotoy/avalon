<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Avalon — човни на причалі</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#e4b46b;--gold2:#f2c98c;--glass:rgba(11,16,23,.78);--line:rgba(255,255,255,.1);--txt:#f2f4f7;--mut:#9ba7b3;--peek:112px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Montserrat,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;background:#0a111d;color:var(--txt);touch-action:none;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;display:block}
a{color:inherit}
.blur{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}

/* шапка */
#top{position:fixed;top:0;left:0;right:0;height:66px;padding:0 26px;display:flex;align-items:center;gap:20px;z-index:6;background:linear-gradient(rgba(5,9,15,.9),rgba(5,9,15,0));pointer-events:none}
#top>*{pointer-events:auto}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:21px;letter-spacing:.16em;text-decoration:none}
.logo small{font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--mut);border-left:1px solid var(--line);padding-left:12px}
nav{margin-left:auto;display:flex;gap:28px;font-size:12px;font-weight:700;letter-spacing:.16em}
nav a{text-decoration:none;opacity:.85}nav a:hover{opacity:1;color:var(--gold2)}
.pill{background:var(--gold);color:#1b1408;font-weight:800;font-size:12px;letter-spacing:.14em;padding:12px 20px;border-radius:30px;text-decoration:none;white-space:nowrap}

/* кнопка назад */
#back{position:fixed;top:76px;left:26px;z-index:6;display:none;color:var(--txt);font:700 14px/1 Montserrat,Arial,sans-serif;letter-spacing:.12em;padding:13px 20px;border-radius:30px;cursor:pointer}
#back:hover{border-color:rgba(228,180,107,.6)}

/* підписи човнів на причалі */
#labels{position:fixed;top:0;left:0;pointer-events:none;z-index:1}
.label{pointer-events:auto;cursor:pointer;border-radius:14px;padding:12px 16px;min-width:150px;white-space:nowrap;transition:border-color .25s,box-shadow .25s}
.label.r{transform:translateX(55%)}.label.l{transform:translateX(-55%);text-align:right}
.label.on{border-color:rgba(228,180,107,.75);box-shadow:0 0 24px rgba(228,180,107,.18)}
.label .t{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--gold)}
.label b{display:block;font-size:22px;font-weight:800;margin-top:4px}
.label .pr{font-size:17px;font-weight:700;color:var(--gold2);margin-top:2px}
.label small{display:block;font-size:12px;color:var(--mut);margin-top:6px}

#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:5;padding:14px 24px;border-radius:30px;font-size:14px;font-weight:700;letter-spacing:.05em;pointer-events:none;white-space:nowrap}
#hint span{color:var(--gold)}

/* завантаження */
#load{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0a111d;font-weight:800;letter-spacing:.3em;font-size:22px;text-align:center;padding:20px}
#load .bar{width:180px;height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
#load small{font-size:13px;letter-spacing:.08em;font-weight:600;color:var(--mut);max-width:420px;line-height:1.5}

/* картка човна */
#card{position:fixed;z-index:5;display:none;touch-action:pan-y;overscroll-behavior:contain}
.tag{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--gold)}
#card h2{margin:6px 0 0;font-size:30px;font-weight:800;line-height:1.1}
.price{font-size:26px;font-weight:800;color:var(--gold2);margin-top:6px}
.toggle{display:none}
.rating{font-size:14px;color:var(--mut);font-weight:600;margin-top:12px}.rating b{color:var(--gold)}
.desc{font-size:15px;color:#cdd4dc;line-height:1.5;margin-top:8px}
.free{font-size:14px;font-weight:700;color:#8fdcaa;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.cell{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.cell small{display:block;font-size:12px;color:var(--mut)}.cell b{display:block;font-size:16px;margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:800 13px/1 Montserrat,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:16px 10px;border-radius:30px;cursor:pointer;border:0;color:var(--txt)}
.ghost{background:transparent;border:1px solid rgba(255,255,255,.28)}
.ghost.on{background:#fff;color:#111;border-color:#fff}
.gold{background:var(--gold);color:#1b1408;margin-top:8px}
.call{background:rgba(255,255,255,.08);margin-top:8px}
details{border-top:1px solid var(--line);padding:14px 0 4px;margin-top:14px}
summary{font-size:15px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";color:var(--gold);font-size:18px;line-height:1}details[open] summary:after{content:"−"}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
td{padding:8px 0;border-bottom:1px solid var(--line);color:var(--mut)}td:last-child{text-align:right;color:var(--txt);font-weight:600}
.more{font-size:14px;color:var(--mut);margin-top:16px;line-height:1.5}.more a{color:var(--gold2)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.pager button{background:transparent;border:1px solid rgba(255,255,255,.22);color:var(--txt);font:700 13px Montserrat,Arial,sans-serif;letter-spacing:.06em;padding:11px 15px;border-radius:30px;cursor:pointer}
.pager button:hover{border-color:var(--gold)}
.pager span{font-size:13px;color:var(--mut);font-weight:700}

@media (min-width:900px){
 #card{top:78px;right:26px;bottom:26px;width:400px;border-radius:18px;padding:24px 24px 18px;overflow-y:auto}
}
@media (max-width:899px){
 #top{height:58px;padding:0 14px}
 nav,.logo small{display:none}
 .logo{font-size:18px}.pill{margin-left:auto;padding:11px 15px}
 #back{top:62px;left:14px;padding:11px 16px;font-size:13px}
 .label{min-width:0;padding:10px 13px}.label b{font-size:19px}.label .pr{font-size:15px}.label small{display:none}
 #card{left:8px;right:8px;bottom:8px;height:var(--peek);border-radius:18px;padding:14px 16px;overflow:hidden;transition:height .3s}
 #card.open{height:78vh;overflow-y:auto}
 .head{display:flex;align-items:center;justify-content:space-between;gap:10px}
 .tag{font-size:10px}#card h2{font-size:22px;margin-top:3px}.price{font-size:20px;margin-top:3px}
 .toggle{display:block;width:auto;margin:0;padding:13px 16px;white-space:nowrap}
 .cell b{font-size:15px}
 body.sel #hint{display:none}
}
</style></head><body>

<script type="module">

 {name:'AT290',tag:'МОТОРНИЙ · СІРИЙ',sub:'Двомісний моторний ПВХ човен з пересувними сидіннями та розбірними веслами.',price:'13 000 грн',rating:'4.91',reviews:11,

 uniforms:{top:{value:v3(0x0b1430)},mid:{value:v3(0x26386a)},hor:{value:v3(0x5b6392)},warm:{value:v3(0xe28c5f)},bottom:{value:v3(0x111826)},sunDir:{value:new THREE.Vector3(0.3,0,-1).normalize()}},

 fragmentShader:`uniform vec3 top,mid,hor,warm,bottom,sunDir;varying vec3 vDir;

 const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,`rgba(${rgb},1)`);gr.addColorStop(.35,`rgba(${rgb},.45)`);gr.addColorStop(1,`rgba(${rgb},0)`);

const bulbGeo=new THREE.BoxGeometry(0.16,0.02,0.1);

const boomGeo=new THREE.BoxGeometry(1,0.06,0.07);
const buoyMat=new THREE.MeshStandardMaterial({color:0xf2f2f2,roughness:0.4,emissive:0x303030});

const spots=[];

// ---------- берег ----------
const ground=new THREE.Mesh(new THREE.BoxGeometry(260,2,40),new THREE.MeshStandardMaterial({color:0x223020,roughness:1}));ground.position.set(0,-0.3,-28);world.add(ground);
const sand=new THREE.Mesh(new THREE.BoxGeometry(260,0.4,3),new THREE.MeshStandardMaterial({color:0x6c6350,roughness:1}));sand.position.set(0,0.1,-7.5);world.add(sand);
const spruceMats=[0,1,2].map(i=>new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.38,0.3,0.08+i*0.02),roughness:1,flatShading:true}));
const leafMats=[0,1,2].map(i=>new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.27,0.32,0.12+i*0.025),roughness:1,flatShading:true}));
function spruce(x,z,s){const g=new THREE.Group();const t=new THREE.Mesh(new THREE.CylinderGeometry(0.12*s,0.18*s,1.2*s,6),darkMat);t.position.y=0.6*s;g.add(t);
 const m=spruceMats[Math.floor(Math.random()*3)];
 for(let i=0;i<4;i++){const c=new THREE.Mesh(new THREE.ConeGeometry((1.3-i*0.27)*s,1.6*s,9),m);c.position.y=(1.4+i*0.85)*s;c.castShadow=true;g.add(c);}
 g.position.set(x,0.7,z);world.add(g);}
function leafy(x,z,s){const g=new THREE.Group();const t=new THREE.Mesh(new THREE.CylinderGeometry(0.14*s,0.2*s,2*s,6),darkMat);t.position.y=s;g.add(t);
 const m=leafMats[Math.floor(Math.random()*3)];
 for(let i=0;i<5;i++){const b=new THREE.Mesh(new THREE.IcosahedronGeometry((0.8+Math.random()*0.5)*s,1),m);
  b.position.set((Math.random()-0.5)*1.4*s,(2.3+Math.random())*s,(Math.random()-0.5)*1.4*s);b.castShadow=true;g.add(b);}
 g.position.set(x,0.7,z);world.add(g);}
for(let i=0;i<60;i++){const x=-40+Math.random()*80,z=-10-Math.random()*16;(Math.random()<0.6?spruce:leafy)(x,z,0.9+Math.random()*0.7);}
// далекі вогники на березі
for(let i=0;i<34;i++){const s=new THREE.Sprite(bulbGlowMat);const k=0.35+Math.random()*0.5;s.scale.set(k,k,1);s.position.set(-70+Math.random()*140,0.8+Math.random()*2.5,-24-Math.random()*10);world.add(s);}
// пагорби по горизонту
const hillGeo=new THREE.SphereGeometry(1,16,8);
const hillMats=[0,1,2].map(i=>new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.36,0.25,0.06+i*0.02),roughness:1,flatShading:true}));
for(let i=0;i<60;i++){const a=i/60*Math.PI*2+Math.random()*0.05,rad=150+Math.random()*60;
 const h=new THREE.Mesh(hillGeo,hillMats[i%3]);
 h.scale.set(25+Math.random()*25,8+Math.random()*14,20);h.position.set(Math.cos(a)*rad,-2,Math.sin(a)*rad-10);h.rotation.y=-a;world.add(h);}

// ---------- студія для режиму "окремо" ----------
const studio=new THREE.Group();studio.visible=false;scene.add(studio);
const floor=new THREE.Mesh(new THREE.CircleGeometry(7,64),new THREE.MeshStandardMaterial({color:0x1a212b,roughness:0.6}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;studio.add(floor);
const ring=new THREE.Mesh(new THREE.RingGeometry(3.2,3.26,96),new THREE.MeshBasicMaterial({color:0xe4b46b,transparent:true,opacity:0.5,toneMapped:false}));ring.rotation.x=-Math.PI/2;ring.position.y=0.01;studio.add(ring);

// ---------- стан і камера ----------
const isDesk=()=>innerWidth>=900;
let desk=isDesk(), listZ=1, selected=null, anim=null, studioOn=false, hovered=null, bw=1.66;
let shiftX=0,shiftY=0;
const rows=()=>desk?Math.ceil(BOATS.length/2):BOATS.length;
const maxZ=()=>(rows()-1)*GAP+1;
const listView=()=>desk
 ?{pos:new THREE.Vector3(0,9.6,listZ+3.6),target:new THREE.Vector3(0,0,listZ+0.6)}
 :{pos:new THREE.Vector3(0.55,11.2,listZ+4.2),target:new THREE.Vector3(0.55,0,listZ+0.8)};
const controls=new OrbitControls(cam,r.domElement);
controls.enableDamping=true;controls.enablePan=false;controls.maxPolarAngle=Math.PI/2.1;controls.enabled=false;controls.autoRotateSpeed=1.4;
{const v=listView();cam.position.copy(v.pos);controls.target.copy(v.target);}

const boats=[],labels=[],hits=[],frames=[];
const stripGeo=new THREE.BoxGeometry(1,0.01,1);
function makeFrame(w,l){
 const g=new THREE.Group();
 const mat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false,toneMapped:false});
 const fill=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false,toneMapped:false});
 [[w,l,0.045],[w+0.26,l+0.26,0.025]].forEach(([W,L,t])=>{
  [[W+t,t,0,L/2],[W+t,t,0,-L/2],[t,L,W/2,0],[t,L,-W/2,0]].forEach(([sx,sz,x,z])=>{const m=new THREE.Mesh(stripGeo,mat);m.scale.set(sx,1,sz);m.position.set(x,0,z);g.add(m);});
 });
 const f=new THREE.Mesh(planeGeo,fill);f.scale.set(w,1,l);f.position.y=-0.005;g.add(f);
 g.userData={mat,fill,o:0};scene.add(g);return g;
}

function arrange(){
 desk=isDesk();
 const pierX=desk?0:-(PIER_HALF+0.2+bw/2);
 pier.position.x=pierX;
 dress.clear();
 boats.forEach((b,i)=>{
  let side,z;
  if(desk){side=i%2?1:-1;z=Math.floor(i/2)*GAP;}else{side=1;z=i*GAP;}
  const edge=pierX+side*PIER_HALF;
  const x=edge+side*(0.2+bw/2);
  b.position.x=x;b.position.z=z;b.userData.side=side;
  frames[i].position.set(x,0.07,z);
  labels[i].obj.position.set(x+side*(bw/2+0.25),0.4,z);
  labels[i].inner.className='label blur '+(side>0?'r':'l');
  // розмітка місця: білі плавучі лінії з буями
  const L=bw+1.1;
  [z-GAP/2,z+GAP/2].forEach(zz=>{
   const m=new THREE.Mesh(boomGeo,boomMat);m.scale.x=L;m.position.set(edge+side*L/2,0.04,zz);m.receiveShadow=true;dress.add(m);
   const bu=new THREE.Mesh(buoyGeo,buoyMat);bu.position.set(edge+side*L,0.08,zz);dress.add(bu);
  });
  // ліхтар біля човна
  const lx=edge-side*0.14, hx=lx+side*0.4;
  const post=new THREE.Mesh(lampPostGeo,metalMat);post.position.set(lx,PH+1.5,z);post.castShadow=true;dress.add(post);
  const arm=new THREE.Mesh(lampArmGeo,metalMat);arm.position.set(lx+side*0.2,PH+2.98,z);dress.add(arm);
  const head=new THREE.Mesh(lampHeadGeo,metalMat);head.position.set(hx,PH+2.95,z);dress.add(head);
  const bulb=new THREE.Mesh(bulbGeo,bulbMat);bulb.position.set(hx,PH+2.91,z);dress.add(bulb);
  const glow=new THREE.Sprite(bulbGlowMat);glow.scale.set(1.1,1.1,1);glow.position.set(hx,PH+2.88,z);dress.add(glow);
  const pw=new THREE.Mesh(planeGeo,poolWaterMat);pw.scale.set(6.5,1,6.5);pw.position.set((hx+x)/2,0.03,z);dress.add(pw);
  const pd=new THREE.Mesh(planeGeo,poolDeckMat);pd.scale.set(3.4,1,3.4);pd.position.set(lx,PH+0.045,z);dress.add(pd);
  const sp=spots[i];sp.position.set(hx,PH+2.85,z);sp.target.position.set(x,0.3,z);
 });
 listZ=THREE.MathUtils.clamp(listZ,1,maxZ());
}

// ---------- завантаження моделі ----------
const loadTxt=document.getElementById('loadTxt'),bar=document.getElementById('bar');
const draco=new DRACOLoader().setDecoderPath(CDN+'libs/draco/');
const ktx2=new KTX2Loader().setTranscoderPath(CDN+'libs/basis/').detectSupport(r);
const loader=new GLTFLoader().setDRACOLoader(draco).setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder);
loader.load('boat.glb',gltf=>{
 const raw=gltf.scene;raw.traverse(o=>{if(o.isMesh)o.castShadow=true;});
 const s0=new THREE.Box3().setFromObject(raw).getSize(new THREE.Vector3());
 if(s0.x>s0.z)raw.rotation.y=Math.PI/2;   // човен уздовж причалу
 const model=new THREE.Group();model.add(raw);
 const s1=new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3());
 model.scale.setScalar(BOAT_SIZE/s1.z);
 const bb=new THREE.Box3().setFromObject(model),c=bb.getCenter(new THREE.Vector3()),sz=bb.getSize(new THREE.Vector3());
 model.position.set(-c.x,-bb.min.y,-c.z);bw=sz.x;
 const hitGeo=new THREE.BoxGeometry(sz.x+0.3,sz.y+0.6,sz.z+0.3).translate(0,sz.y/2,0);
 const hitMat=new THREE.MeshBasicMaterial({visible:false});
 BOATS.forEach((d,i)=>{
  const grp=new THREE.Group();grp.add(model.clone());grp.position.y=0.05;grp.userData=d;scene.add(grp);boats.push(grp);
  const hit=new THREE.Mesh(hitGeo,hitMat);hit.userData.boat=grp;grp.add(hit);hits.push(hit);
  frames.push(makeFrame(sz.x+0.5,sz.z+0.5));
  const sp=new THREE.SpotLight(0xffc68a,26*LAMPS,16,0.85,0.8,2);scene.add(sp);scene.add(sp.target);spots.push(sp);
  const wrap=document.createElement('div');const inner=document.createElement('div');wrap.appendChild(inner);
  inner.innerHTML=`<div class="t">${d.tag||''}</div><b>${d.name}</b><div class="pr">${d.price}</div><small>Натисніть, щоб роздивитися</small>`;
  inner.onclick=()=>select(grp);
  inner.onmouseenter=()=>{hovered=grp;};inner.onmouseleave=()=>{if(hovered===grp)hovered=null;};
  const obj=new CSS2DObject(wrap);scene.add(obj);labels.push({obj,inner});
 });
 arrange();
 document.getElementById('load').style.display='none';
},e=>{if(e.total)bar.style.width=Math.round(e.loaded/e.total*100)+'%';},
err=>{loadTxt.textContent='Не вдалося завантажити boat.glb: '+(err&&err.message?err.message:err);});

// ---------- прокрутка списку ----------
const scrollBy=d=>{if(selected||anim)return;listZ=THREE.MathUtils.clamp(listZ+d,1,maxZ());};
addEventListener('wheel',e=>scrollBy(e.deltaY*0.01),{passive:true});
let ty=null,moved=0;
addEventListener('touchstart',e=>{ty=e.touches[0].clientY;moved=0;},{passive:true});
addEventListener('touchmove',e=>{if(ty===null||selected)return;const y=e.touches[0].clientY;scrollBy((ty-y)*0.03);moved+=Math.abs(ty-y);ty=y;},{passive:true});
addEventListener('touchend',()=>{ty=null;});

// ---------- зсув картинки, щоб човен не ховався під панеллю ----------
function wantShift(){
 if(!selected)return [0,0];
 if(isDesk())return [PANEL_W,0];
 return [0,card.classList.contains('open')?0:PEEK+8];
}
function applyView(){
 const W=innerWidth,H=innerHeight;
 if(shiftX<0.5&&shiftY<0.5){cam.clearViewOffset();cam.aspect=W/H;}
 else{cam.aspect=(W+shiftX)/(H+shiftY);cam.setViewOffset(W+shiftX,H+shiftY,shiftX,shiftY,W,H);}
 cam.updateProjectionMatrix();
}
addEventListener('resize',()=>{
 r.setSize(innerWidth,innerHeight);lr.setSize(innerWidth,innerHeight);
 if(isDesk()!==desk&&!selected&&boats.length)arrange();
});

// ---------- режим "окремо" ----------
function setStudio(on){
 studioOn=on;world.visible=!on;studio.visible=on;
 boats.forEach(b=>b.visible=!on||b===selected);
 spots.forEach(s=>s.intensity=on?0:26*LAMPS);
 scene.background=on?new THREE.Color(0x0f141b):null;sky.visible=!on;scene.fog=on?null:FOG;
 if(on&&selected){
  studio.position.set(selected.position.x,0,selected.position.z);
  studioKey.intensity=60;studioKey.position.set(selected.position.x+2,6,selected.position.z+3);studioKey.target.position.copy(selected.position);
  controls.maxDistance=12;controls.minDistance=2;controls.maxPolarAngle=Math.PI/2.05;
 }else{studioKey.intensity=0;controls.maxDistance=10;controls.minDistance=2.6;controls.maxPolarAngle=Math.PI/2.1;}
 const b=document.getElementById('studioBtn');if(b)b.classList.toggle('on',on);
 if(on&&!isDesk())setOpen(false);
}
function setSpin(on){controls.autoRotate=on;const b=document.getElementById('spinBtn');if(b){b.classList.toggle('on',on);b.textContent=on?'Стоп 360°':'360° огляд';}}

// ---------- картка човна ----------
const card=document.getElementById('card');
function setOpen(o){card.classList.toggle('open',o);const t=document.getElementById('toggle');if(t)t.textContent=o?'Сховати ▼':'Деталі ▲';if(!o)card.scrollTop=0;}
const trs=a=>a.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('');
function showCard(d){
 const i=BOATS.indexOf(d),n=BOATS.length,prev=BOATS[(i-1+n)%n],next=BOATS[(i+1)%n];
 card.innerHTML=`<div class="head"><div><div class="tag">${d.tag||''}</div><h2>Avalon ${d.name}</h2><div class="price">${d.price}</div></div>
   <button class="btn gold toggle" id="toggle">Деталі ▲</button></div>
  ${d.rating?`<div class="rating"><b>★ ${d.rating}</b> · ${d.reviews} відгуків покупців</div>`:''}
  <div class="desc">${d.sub||''}</div>
  <div class="free">🚚 Безкоштовна доставка Новою Поштою</div>
  ${d.key?`<div class="grid">${d.key.map(([k,v])=>`<div class="cell"><small>${k}</small><b>${v}</b></div>`).join('')}</div>`:''}
  <div class="row2"><button class="btn ghost" id="spinBtn">360° огляд</button><button class="btn ghost" id="studioBtn">Окремо</button></div>
  <a class="btn gold" href="${d.url}" target="_blank" rel="noopener">Замовити</a>
  <a class="btn call" href="tel:${PHONE}">📞 Подзвонити</a>
  ${d.kit?`<details><summary>Що в комплекті</summary><table>${trs(d.kit)}</table></details>`:''}
  ${d.specs?`<details><summary>Усі характеристики</summary><table>${trs(d.specs)}</table></details>`:''}
  ${!d.specs?`<div class="more">Повні характеристики — на <a href="${d.url}" target="_blank" rel="noopener">сторінці товару</a>.</div>`:''}
  <div class="pager"><button id="prev">‹ ${prev.name}</button><span>${i+1} / ${n}</span><button id="next">${next.name} ›</button></div>`;
 card.style.display='block';setOpen(false);
 document.getElementById('toggle').onclick=()=>setOpen(!card.classList.contains('open'));
 document.getElementById('studioBtn').onclick=()=>setStudio(!studioOn);
 document.getElementById('spinBtn').onclick=()=>setSpin(!controls.autoRotate);
 document.getElementById('prev').onclick=()=>step(-1);
 document.getElementById('next').onclick=()=>step(1);
}

const back=document.getElementById('back');back.onclick=goBack;
addEventListener('keydown',e=>{if(!selected)return;if(e.key==='Escape')goBack();if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);});

function fly(pos,target,done){anim={p0:cam.position.clone(),t0:controls.target.clone(),p1:pos,t1:target,start:performance.now(),dur:1200,done};}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function select(o){
 if(studioOn)setStudio(false);
 setSpin(false);
 selected=o;hovered=null;controls.enabled=false;
 document.body.classList.add('sel');
 lr.domElement.style.display='none';document.getElementById('hint').style.display='none';
 back.style.display='block';
 showCard(o.userData);
 const s=o.userData.side||1;
 const t=o.position.clone().add(new THREE.Vector3(0,0.35,0));
 fly(o.position.clone().add(new THREE.Vector3(3.4*s,1.7,3.6)),t,()=>{controls.enabled=true;controls.minDistance=2.6;controls.maxDistance=10;});
}
function step(d){if(!selected)return;const n=boats.length;select(boats[(boats.indexOf(selected)+d+n)%n]);}
function goBack(){
 if(!selected)return;
 if(studioOn)setStudio(false);
 setSpin(false);
 controls.enabled=false;selected=null;card.style.display='none';setOpen(false);
 document.body.classList.remove('sel');back.style.display='none';
 if(isDesk()!==desk)arrange();
 const v=listView();fly(v.pos,v.target,()=>{lr.domElement.style.display='';document.getElementById('hint').style.display='';});
}

// ---------- натискання і наведення ----------
const ray=new THREE.Raycaster(),m=new THREE.Vector2();
function pick(e){m.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(m,cam);const h=ray.intersectObjects(hits,false)[0];return h?h.object.userData.boat:null;}
r.domElement.addEventListener('click',e=>{if(selected||anim||moved>10)return;const b=pick(e);if(b)select(b);});
r.domElement.addEventListener('pointermove',e=>{
 if(e.pointerType!=='mouse'||selected||anim)return;
 hovered=pick(e);r.domElement.style.cursor=hovered?'pointer':'';
});

// ---------- анімація ----------
(function loop(t){requestAnimationFrame(loop);
 wn.offset.set(t*0.00001,t*0.000015);
 if(anim){const k=Math.min((t-anim.start)/anim.dur,1),e=ease(k);cam.position.lerpVectors(anim.p0,anim.p1,e);controls.target.lerpVectors(anim.t0,anim.t1,e);if(k>=1){const d=anim.done;anim=null;d&&d();}}
 else if(!selected){const v=listView();cam.position.lerp(v.pos,0.12);controls.target.lerp(v.target,0.12);}
 const [sx,sy]=wantShift();shiftX+=(sx-shiftX)*0.1;shiftY+=(sy-shiftY)*0.1;applyView();
 sky.position.copy(cam.position);
 moon.position.copy(moonDir).multiplyScalar(30).add(controls.target);moon.target.position.copy(controls.target);
 // рамка навколо човна, на який наведено (на телефоні — найближчий до центру)
 let focus=hovered;
 if(!focus&&!desk&&!selected&&boats.length){let best=1e9;boats.forEach(b=>{const dz=Math.abs(b.position.z-(controls.target.z-0.8));if(dz<best){best=dz;focus=b;}});}
 boats.forEach((b,i)=>{
  const amp=studioOn?0:1;b.position.y=0.05+Math.sin(t/800+i)*0.03*amp;b.rotation.z=Math.sin(t/1100+i)*0.015*amp;
  const f=frames[i].userData,on=(!selected&&b===focus)?1:0;f.o+=(on-f.o)*0.12;
  f.mat.opacity=f.o*(0.75+Math.sin(t/400)*0.15);f.fill.opacity=f.o*0.05;frames[i].visible=f.o>0.01&&!studioOn;
  labels[i].inner.classList.toggle('on',on===1);
 });
 if(selected)controls.update();else cam.lookAt(controls.target);
 r.render(scene,cam);lr.render(scene,cam);
})(0);
</script></body></html>
